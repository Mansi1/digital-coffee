services: 
  dev-postgres:
    image: postgres:18.3
    container_name: dev-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-postgres:
    image: postgres:18.3
    container_name: test-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql
    networks:
      - backend

volumes:
  postgres_data:
  test_postgres_data:

networks:
  backend: